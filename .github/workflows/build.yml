name: Build EasyBoutik APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev \
          build-essential libstdc++6

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
      run: |
        # Accepter automatiquement les licences
        yes | buildozer -v android debug || true
        
        # Forcer l'installation des build-tools dans le SDK de Buildozer
        SDK="$HOME/.buildozer/android/platform/android-sdk"
        if [ -d "$SDK" ]; then
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$PATH:$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools"
          yes | sdkmanager --sdk_root="$SDK" --licenses || true
          sdkmanager --sdk_root="$SDK" "build-tools;34.0.0" "platform-tools" "platforms;android-34" || true
        fi

        # Relancer la compilation
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: EasyBoutik-APK
        path: bin/*.apk
        retention-days: 14
